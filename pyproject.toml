[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-isp-dark-preview"
version = "0.4.0"
description = "面向麒麟9000主摄和长焦RYYB暗光预览的条件式MobileNAFNet训练与模型压缩工程"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=2.0",
  "torch>=2.6",
  "h5py>=3.10",
  "scipy>=1.13",
  "PyYAML>=6.0",
  "safetensors>=0.5",
  "torch-pruning==1.6.1",
  "onnx>=1.17",
  "onnxruntime>=1.20",
]

[project.optional-dependencies]
export = ["onnxscript>=0.2"]
pruning = []
test = ["pytest>=8.0"]

[project.scripts]
ai-isp-cpu-flow = "ai_isp.cli:main"
ai-isp-v4-pipeline = "ai_isp.pipeline:main"

[tool.setuptools.packages.find]
include = ["ai_isp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
