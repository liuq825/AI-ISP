[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-isp-dark-preview"
version = "0.1.0"
description = "面向暗光拍照预览的条件式 RAW 域降噪 CPU/ONNX 工程验证实现"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=2.0",
  "torch>=2.6",
  "h5py>=3.10",
  "scipy>=1.13",
  "PyYAML>=6.0",
  "safetensors>=0.5",
]

[project.optional-dependencies]
export = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.2"]
pruning = ["torch-pruning==1.6.1"]
test = ["pytest>=8.0"]

[project.scripts]
ai-isp-cpu-flow = "ai_isp.cli:main"

[tool.setuptools.packages.find]
include = ["ai_isp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

